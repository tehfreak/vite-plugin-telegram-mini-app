name: CI

on:
    push:
        branches: [master]
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: ['20.19', '22.12', '24']
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: npm run typecheck
            - run: npm run lint
            - run: npm run format:check
            - run: npm test

    package:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: npx --yes publint
            - run: npx --yes @arethetypeswrong/cli --pack --ignore-rules no-resolution cjs-resolves-to-esm
