<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>vite-plugin-telegram-mini-app-mock playground</title>
		<script src="https://telegram.org/js/telegram-web-app.js"></script>
		<style>
			body {
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
				margin: 0;
				padding: 16px 16px 96px;
				max-width: 780px;
			}
			h1 {
				font-size: 20px;
				margin: 0 0 4px;
			}
			h2 {
				font-size: 12px;
				text-transform: uppercase;
				letter-spacing: 0.04em;
				color: #707579;
				margin: 22px 0 6px;
			}
			table {
				width: 100%;
				border-collapse: collapse;
				font-size: 12px;
				font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
			}
			td {
				border-top: 1px solid #e5e5e6;
				padding: 4px 6px;
				vertical-align: top;
			}
			td:first-child {
				width: 200px;
				color: #707579;
				white-space: nowrap;
			}
			td.value {
				word-break: break-all;
			}
			.swatch {
				display: inline-block;
				width: 10px;
				height: 10px;
				border: 1px solid #0002;
				border-radius: 2px;
				margin-right: 6px;
				vertical-align: -1px;
			}
			.methods {
				font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
				font-size: 12px;
				color: #3390ec;
				line-height: 1.8;
			}
			.actions {
				position: fixed;
				left: 0;
				right: 0;
				bottom: 0;
				display: flex;
				gap: 8px;
				flex-wrap: wrap;
				padding: 10px 16px;
				background: #fff;
				border-top: 1px solid #e5e5e6;
			}
			.hint {
				font-size: 12px;
				color: #707579;
				margin: 0 0 12px;
			}
		</style>
	</head>
	<body>
		<h1>tma-mock playground</h1>
		<p class="hint">Everything the app sees through <code>window.Telegram.WebApp</code>. Values are read off the live object on every render.</p>
		<div id="out"></div>

		<div class="actions">
			<button id="back">BackButton.show()</button>
			<button id="main">MainButton.setParams()</button>
			<button id="progress">MainButton.showProgress()</button>
			<button id="cloud">CloudStorage</button>
			<button id="confirm">showConfirm()</button>
			<button id="refresh">Refresh</button>
		</div>

		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
